<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="icon" type="image/x-icon" href="Sprites/08-Box/Idle.png">
  <title>Kings and Pigs</title>
</head>

<body>
  <style>
    /* Menu pixel font (#63), stored in the repo (fonts/OFL.txt). */
    @font-face {
      font-family: "Press Start 2P";
      src: url("fonts/PressStart2P-Regular.ttf") format("truetype");
      font-display: block;
    }

    html,
    body {
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #000000;
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      position: fixed;
      inset: 0
    }

    canvas {
      display: block;
      flex: none;
      image-rendering: pixelated;
    }

    /* Touch controller (#42). All of its look lives here so it can be reskinned
       (e.g. pixel art) by changing these rules. Hidden unless touch: split below
       the game in portrait, overlaid on it in landscape (#43). */
    #touch-controller {
      --tc-button-size: min(84px, 19vw);
      --tc-gap: min(16px, 3vw);
      --tc-enter-size: calc(var(--tc-button-size) * 0.8);
      --tc-pause-size: calc(var(--tc-button-size) * 0.55);
      --tc-bomb-size: var(--tc-enter-size);
      /* How far Attack sits below Jump; the Bomb button hangs off it. */
      --tc-attack-drop: calc(var(--tc-button-size) * 0.6);
      /* Room above the A/B pair for the Enter button (#44), which pops up
         there without shifting the other controls. In portrait the pause
         button (#45) sits in the same strip, centred, and the Bomb button
         (#77) above A reaches into it. */
      --tc-enter-room: calc(var(--tc-enter-size) + var(--tc-gap));
      /* Tall enough for the staggered A/B pair, the Enter / pause strip above it,
         padding and the home bar; in the portrait split mobile-bootstrap.mjs
         reserves this height when fitting the canvas (the landscape overlay
         reserves none). */
      --tc-panel-min-height: calc(var(--tc-button-size) * 1.6 + var(--tc-enter-room) + var(--tc-gap) * 2 + env(safe-area-inset-bottom));
      --tc-fill: rgba(245, 240, 230, 0.18);
      --tc-fill-pressed: rgba(245, 240, 230, 0.45);
      --tc-border: 2px solid rgba(245, 240, 230, 0.55);
      --tc-glyph-color: #f5f0e6;
      --tc-glyph-size: calc(var(--tc-button-size) * 0.4);
      --tc-side-pad: calc(var(--tc-gap) * 1.5);

      display: none;
      box-sizing: border-box;
      width: 100%;
      min-height: var(--tc-panel-min-height);
      padding: calc(var(--tc-gap) + var(--tc-enter-room)) var(--tc-side-pad) calc(var(--tc-gap) + env(safe-area-inset-bottom));
      align-items: center;
      justify-content: space-between;
      touch-action: none;
    }

    #touch-controller [data-zone] {
      display: flex;
      gap: var(--tc-gap);
      touch-action: none;
    }

    #touch-controller .tc-button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: var(--tc-button-size);
      height: var(--tc-button-size);
      border-radius: 50%;
      border: var(--tc-border);
      background: var(--tc-fill);
      color: var(--tc-glyph-color);
      font: bold var(--tc-glyph-size) sans-serif;
      pointer-events: none;
    }

    #touch-controller .tc-button.is-held {
      background: var(--tc-fill-pressed);
    }

    #touch-controller .tc-actions {
      position: relative;
      display: flex;
      gap: var(--tc-gap);
    }

    /* Enter (#44): only shown while the player can go through a door, just
       above Jump. */
    #touch-controller [data-action="enter"] {
      position: absolute;
      right: calc((var(--tc-button-size) - var(--tc-enter-size)) / 2);
      bottom: calc(100% + var(--tc-gap));
    }

    #touch-controller .tc-button.tc-enter {
      width: var(--tc-enter-size);
      height: var(--tc-enter-size);
    }

    #touch-controller .tc-enter svg,
    /* Pause (#45): a small button centred between the move and action
       clusters (above them in portrait). */
    #touch-controller .tc-button.tc-pause {
      width: var(--tc-pause-size);
      height: var(--tc-pause-size);
      --tc-glyph-size: calc(var(--tc-pause-size) * 0.4);
    }

    /* Attack sits lower-left of Jump, like a gamepad's A/B pair. */
    #touch-controller .tc-actions [data-zone="attack"] {
      margin-top: var(--tc-attack-drop);
    }

    /* Bomb (#77): always shown, just above Attack (as Enter is above Jump),
       so the action cluster stays two buttons wide on narrow phones. */
    #touch-controller .tc-actions [data-zone="bomb"] {
      position: absolute;
      left: calc((var(--tc-button-size) - var(--tc-bomb-size)) / 2);
      top: calc(var(--tc-attack-drop) - var(--tc-gap) - var(--tc-bomb-size));
    }

    #touch-controller .tc-button.tc-bomb {
      width: var(--tc-bomb-size);
      height: var(--tc-bomb-size);
    }

    @media (pointer: coarse) and (orientation: portrait) {
      body {
        flex-direction: column;
        justify-content: flex-start;
      }

      #touch-controller {
        /* Anchors the pause button below. */
        position: relative;
        display: flex;
        flex: 1;
      }

      /* Out of the row so narrow phones keep room for both clusters; it sits
         in the strip reserved above them for Enter. */
      #touch-controller [data-action="pause"] {
        position: absolute;
        top: var(--tc-gap);
        left: 50%;
        transform: translateX(-50%);
      }
    }

    /* Landscape: the game keeps the full height and the controller floats over
       its bottom corners. Only the zones take touches; the gap between them
       (and the top, where the HUD is drawn) passes through to the canvas. */
    @media (pointer: coarse) and (orientation: landscape) {
      #touch-controller {
        --tc-button-size: min(72px, 18vh);

        display: flex;
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        min-height: 0;
        align-items: flex-end;
        padding: var(--tc-gap) max(var(--tc-side-pad), env(safe-area-inset-right)) calc(var(--tc-gap) + env(safe-area-inset-bottom)) max(var(--tc-side-pad), env(safe-area-inset-left));
        opacity: 0.6;
        pointer-events: none;
      }

      #touch-controller [data-zone],
      #touch-controller [data-action] {
        pointer-events: auto;
      }
    }
  </style>
  <canvas></canvas>
  <div id="touch-controller" aria-hidden="true">
    <div data-zone="move">
      <div class="tc-button" data-held="left">◀</div>
      <div class="tc-button" data-held="right">▶</div>
    </div>
    <div data-action="pause">
      <div class="tc-button tc-pause">❚❚</div>
    </div>
    <div class="tc-actions">
      <div data-action="enter" hidden>
        <div class="tc-button tc-enter">
          <!-- Door glyph -->
          <svg viewBox="0 0 16 16" fill="currentColor">
            <path d="M3 15V2a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1v13h2v1H1v-1zm2 0h6V3H5z" />
            <circle cx="9.5" cy="9" r="1" />
          </svg>
        </div>
      </div>
      <div data-zone="bomb">
        <div class="tc-button tc-bomb" data-held="bomb">
          <!-- Bomb glyph -->
          <svg viewBox="0 0 16 16" fill="currentColor">
            <circle cx="7" cy="10" r="5" />
            <path d="M9.5 5.5l2-2 1 1-2 2z" />
            <path d="M12 3.2c.3-1 1.2-1.7 2.3-1.6l-.1 1c-.6 0-1.1.3-1.3.9z" />
          </svg>
        </div>
      </div>
      <div data-zone="attack">
        <div class="tc-button" data-held="attack">A</div>
      </div>
      <div data-zone="jump">
        <div class="tc-button" data-held="jump">B</div>
      </div>
    </div>
  </div>

</body>
