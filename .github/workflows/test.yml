name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  level-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Find the preinstalled browser
        run: |
          browser=$(command -v google-chrome chromium chromium-browser | head -n 1)
          if [ -z "$browser" ]; then
            sudo apt-get update
            sudo apt-get install -y chromium-browser || sudo apt-get install -y chromium
            browser=$(command -v chromium chromium-browser | head -n 1)
          fi
          echo "CHROMIUM=$browser" >> "$GITHUB_ENV"
      - run: npm run level-checks
